<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/vibe.js"></script>
<script src="../../engine/anim.js"></script>
<script src="../../engine/vendor/three.bundle.js"></script>
<script src="../../engine/three3d.js"></script>
<script src="../../engine/effects/fx.js"></script>
<script src="fonttext.js"></script>
<script>
// Effect catalog: one shot per effect id in rhythm.json (made by gen.py). Label = number + 中文名 + English.
FXI('img/');
const ALL=FXL.map(f=>f.id);
const S=RHYTHM.shots.map(sh=>{const f=FXR[sh.id],n=ALL.indexOf(sh.id)+1;return{id:sh.id,draw(t,lt){
  g.save();f.draw(lt,2.5,t);g.restore();
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,170,W,190);
  onDark(()=>{txt('#'+String(n).padStart(2,'0')+'  '+f.zh,CX,262,{size:72,gold:true});
  const sub=f.en+'  ·  '+f.cat+'  ·  '+f.beat;txt(sub,CX,330,{size:Math.min(34,34*900/measure(sub,34,400)),color:'#ddd',w:400})})}}});
VIBE_FILM({seed:7,theme:'gold',scenes:S,fontText:FONTTEXT,
 cover(){background(0);txt('动效库',CX,640,{size:200,gold:true})},cover43(){background(0);txt('动效库',CX,600,{size:180,gold:true})}});
</script></body></html>
