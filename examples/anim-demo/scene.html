<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/vibe.js"></script>
<script src="../../engine/anim.js"></script>
<script src="../../engine/vendor/three.bundle.js"></script>
<script src="../../engine/three3d.js"></script>
<script>
// 3D 开场：金币堆，相机环绕+推近，景深+泛光
const OPEN=VIBE3D({fov:38,dof:{focus:9,aperture:.004},bloom:{strength:.9,threshold:.55},grade:{sat:1.15,warm:.05,vig:.45},
 setup(T,scene,cam){const gold=new T.MeshStandardMaterial({color:0xd9a441,metalness:1,roughness:.25});const grp=new T.Group();
  const geo=new T.CylinderGeometry(1,1,.16,64);for(let s=0;s<5;s++)for(let i=0;i<4+s*3;i++){const m=new T.Mesh(geo,gold);m.position.set((s-2)*2.3,i*.18-2,(s%2)*-1.5);m.rotation.y=i*.3;grp.add(m)}
  scene.add(grp);const L=new T.PointLight(0xffd9a0,60,30);L.position.set(3,5,6);scene.add(L);scene.add(new T.AmbientLight(0x334455,.6));return{grp}},
 update(lt,o,cam,api){api.orbit(lt,{r:lerp(14,9,eio(lt/3.5)),h:lerp(4,1.2,eio(lt/3.5)),a0:-.7,a1:.5,t0:0,t1:3.5,target:[0,-.5,0]});api.focusOn(cam.position.length())}});
// 3D 招牌镜头：穿过一串发光圆环往前推（一镜到底）
const SIG=VIBE3D({fov:55,dof:{focus:6,aperture:.006},bloom:{strength:.7,threshold:.5,radius:.4},grade:{sat:1.2,warm:.08,vig:.5},
 setup(T,scene){const rings=[];for(let i=0;i<14;i++){const m=new T.Mesh(new T.TorusGeometry(2.2,.05,16,96),new T.MeshBasicMaterial({color:new T.Color().setHSL(.1+i*.005,.8,.4)}));m.position.z=-i*4;scene.add(m);rings.push(m)}
  scene.fog=new T.FogExp2(0x07090c,.035);return{rings}},
 update(lt,o,cam,api){api.dolly(lt,[[0,[0,0,6]],[1.2,[.6,.3,-6]],[3,[0,0,-26]]],[0,0,-60]);o.rings.forEach((r,i)=>r.rotation.z=lt*.4+i*.25)}});
const COIN=polyCircle(CX,900,150),BILL=polyRect(CX,900,640,300);
const S=[
 {id:'open3d',draw(t,lt){OPEN.draw(t,lt);
   charAssemble('复利',CX,820,t,.1,{size:220,gold:true,glow:30});
   maskReveal('为什么越往后越快？',CX,1080,lt,M('hook_q'),{size:64})}},
 {id:'swarm',cam:SPLINECAM([[0,[CX,960,1.15]],[1.5,[CX+40,900,1]],[3,[CX,960,1.08]]]),draw(t,lt){
   particleForm(textPoints('72',CX,820,420,7),lt,0,{dur:1,seed:3,out:2.4});
   maskReveal('72 ÷ 年增长率',CX,1180,lt,.9,{size:72,gold:true});
   rise('≈ 翻倍要几年',CX,1300,lt,1.6,{size:52,w:400})}},
 {id:'chart',draw(t,lt){
   chartGrow([1,1.1,1.21,1.33,1.46,1.61],lt,0,{x:150,y:1400,w:780,h:560,morph:1.5,labels:['0','1','2','3','4','5'],fmt:v=>v.toFixed(2)});
   charAssemble('每年 +10%',CX,640,lt,.1,{size:80})}},
 {id:'morph',draw(t,lt){const k=A_clamp((lt-.3)/1);
   parallax([{depth:.15,draw(){for(let i=0;i<9;i++)txt('¥',120+i*110,1500+((i*137)%200),{size:60,a:.15})}},
             {depth:1,draw(){morphShape(COIN,BILL,k);}}],t,{x:Math.sin(lt*1.4)*60,y:0,z:1+.06*lt});
   maskReveal(k<.5?'一枚硬币':'变成一沓钞票',CX,1260,lt,k<.5?0:1,{size:68})}},
 {id:'sig3d',draw(t,lt){SIG.draw(t,lt);
   charAssemble('时间',CX,900,lt,.4,{size:200,gold:true,glow:40});
   rise('才是复利的本金',CX,1120,lt,1.4,{size:60})}},
];
VIBE_FILM({seed:11,theme:'gold',hook:'动效升级样片',scenes:S,
  fontText:'复利为什么越往后快？72÷年增长率≈翻倍要几数每+10%一枚硬币变成沓钞票时间才是的本金动效升级样片¥0123456789.',
  cover(){background(0);txt('复利',CX,640,{size:280,gold:true,glow:40});post(0)}});
</script></body></html>
