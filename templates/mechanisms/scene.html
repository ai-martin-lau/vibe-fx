<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/vibe.js"></script>
<script src="../../engine/mechanisms.js"></script>
<script>
// 机制组件演示：每个镜头一个 MECH 组件 + 一种镜头运动。复制某个镜头到自己的片子里，改 opts 和文字即可。
// 组件都吃 0→1 的进度 k，用 ramp(lt, 开始, 结束) 算，确定性、可任意帧跳渲。
const DIM='rgba(243,236,224,.7)';
// 复利曲线尖端的位置（给 CAM.follow 用），和组件里画的是同一条曲线
const tipK=lt=>eio(ramp(lt,-1.2,5.2));   // 从 -1.2s 起算：第 1 帧曲线已经起步，不从空画面开始
const S=[
 // 1 复利 + 跟随对象：镜头跟着曲线尖端往上走
 {id:'compound',cam:(t,lt)=>{const f=CAM.follow(lt,l=>MECH_TIP(tipK(l)),1.3,.25),k=eio(ramp(lt,4,5.6));
   return{x:lerp(lerp(CX,f.x,.5),CX,k),y:lerp(lerp(960,f.y,.5),960,k),z:lerp(f.z,1,k)}},
  draw(t,lt){ txt('复利',CX,560,{size:84,gold:true}); MECH.compound(tipK(lt),{rate:.2,years:30}); }},
 // 2 杠杆 + 局部放大：先看全景，再推到支点
 {id:'leverage',cam:(t,lt)=>CAM.zoomIn(lt,2.6,4.4,CX,1080,1.3),draw(t,lt){
   txt('杠杆',CX,520,{size:84,gold:true});
   MECH.leverage(eio(ramp(t,HIT('lift')-.2,HIT('lift')+.5)),{ratio:3,small:'1',big:'10'});
   txt('支点选对，小力气抬大东西',CX,1420,{size:48,w:400,color:DIM}); }},
 // 3 漏斗 + 拉远揭示：从瓶颈拉回全景，看清 60 个里只剩几个
 {id:'funnel',cam:(t,lt)=>CAM.pullBack(lt,3.2,5.2,CX,1320,1.7),draw(t,lt){
   txt('筛选',CX,520,{size:84,gold:true});
   MECH.funnel(ramp(lt,0,4.6),{n:60,keep:.1}); }},
 // 4 消耗：能量被一点点抽走
 {id:'depletion',draw(t,lt){
   txt('消耗',CX,420,{size:84,gold:true});
   MECH.depletion(ramp(lt,0,4.4),{label:'每天一点，没人注意'}); }},
 // 5 反馈回路：高潮 drop 落在切点，光点每圈变大
 {id:'loop',draw(t,lt){
   txt('飞轮',CX,480,{size:84,gold:true});
   MECH.loop(ramp(lt,0,6.5),{nodes:['投入','结果','信心'],laps:3,gain:1.6});
   rise('越转越快',CX,1480,lt,4.8,{size:56}); }},
];
// 跟随用：只算尖端位置，不画（和 MECH.compound 同一套坐标）
function MECH_TIP(k){const x0=170,y0=1400,w=700,h=760,r=.2,Y=30,maxV=Math.pow(1+r,Y),yr=Y*clamp(k);return{x:x0+w*yr/Y,y:y0-h*(Math.pow(1+r,yr)-1)/(maxV-1)}}
VIBE_FILM({seed:31, theme:'gold', hook:'五个机制，一眼看懂', scenes:S,
  fontText:'复利第年×0123456789,杠杆支点选对小力气抬大东西筛选/消耗每天一点没人注意%飞轮投入结果信心圈越转快五个机制一眼看懂',
  cover(){ background(0); txt('五个机制',CX,640,{size:180,gold:true,glow:40}); post(0); }});
</script></body></html>
